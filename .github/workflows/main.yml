name: CI/CD Pipeline - Cloud Health & Echo Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GRUPO_RECURSOS: rg-bootcamp-azure
  NOMBRE_IMAGEN: cloud-health-service
  UBICACION_AZURE: eastus2

jobs:
  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      - run: pytest src/test_app.py -v --tb=short

  build-and-push:
    name: Compilar y Publicar en ACR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      etiqueta_imagen: ${{ steps.info-imagen.outputs.etiqueta_completa }}
      servidor_acr: ${{ steps.buscar-acr.outputs.servidor_login }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - id: buscar-acr
        run: |
          NOMBRE_ACR=$(az acr list --resource-group ${{ env.GRUPO_RECURSOS }} --query "[0].name" -o tsv)
          if [ -z "$NOMBRE_ACR" ]; then
            az deployment group create \
              --resource-group ${{ env.GRUPO_RECURSOS }} \
              --template-file infra/main.bicep \
              --parameters ubicacion=${{ env.UBICACION_AZURE }}
            NOMBRE_ACR=$(az acr list --resource-group ${{ env.GRUPO_RECURSOS }} --query "[0].name" -o tsv)
          fi
          SERVIDOR_LOGIN=$(az acr show --name "$NOMBRE_ACR" --query "loginServer" -o tsv)
          echo "nombre_acr=$NOMBRE_ACR" >> $GITHUB_OUTPUT
          echo "servidor_login=$SERVIDOR_LOGIN" >> $GITHUB_OUTPUT
      - run: az acr login --name ${{ steps.buscar-acr.outputs.nombre_acr }}
      - id: info-imagen
        run: |
          SERVIDOR="${{ steps.buscar-acr.outputs.servidor_login }}"
          ETIQUETA_COMPLETA="$SERVIDOR/${{ env.NOMBRE_IMAGEN }}:${{ github.sha }}"
          ETIQUETA_LATEST="$SERVIDOR/${{ env.NOMBRE_IMAGEN }}:latest"
          echo "etiqueta_completa=$ETIQUETA_COMPLETA" >> $GITHUB_OUTPUT
          echo "etiqueta_latest=$ETIQUETA_LATEST" >> $GITHUB_OUTPUT
      - run: |
          docker build \
            --file src/Dockerfile \
            --tag ${{ steps.info-imagen.outputs.etiqueta_completa }} \
            --tag ${{ steps.info-imagen.outputs.etiqueta_latest }} \
            src/
      - run: |
          docker push ${{ steps.info-imagen.outputs.etiqueta_completa }}
          docker push ${{ steps.info-imagen.outputs.etiqueta_latest }}

  deploy:
    name: Desplegar en Azure
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - id: despliegue-bicep
        run: |
          SALIDA_DESPLIEGUE=$(az deployment group create \
            --resource-group ${{ env.GRUPO_RECURSOS }} \
            --template-file infra/main.bicep \
            --parameters ubicacion=${{ env.UBICACION_AZURE }} \
            --parameters imagenContenedor="${{ needs.build-and-push.outputs.etiqueta_imagen }}" \
            --query "properties.outputs" -o json)
          NOMBRE_APP=$(echo "$SALIDA_DESPLIEGUE" | jq -r '.nombreContainerApp.value')
          URL_APP=$(echo "$SALIDA_DESPLIEGUE" | jq -r '.urlContainerApp.value')
          echo "nombre_app=$NOMBRE_APP" >> $GITHUB_OUTPUT
          echo "url_app=$URL_APP" >> $GITHUB_OUTPUT
      - run: |
          az containerapp update \
            --name ca-cloud-health \
            --resource-group ${{ env.GRUPO_RECURSOS }} \
            --image "${{ needs.build-and-push.outputs.etiqueta_imagen }}"
      - run: |
          URL_APP=$(az containerapp show \
            --name ca-cloud-health \
            --resource-group ${{ env.GRUPO_RECURSOS }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "URL: https://$URL_APP"
          sleep 10
          curl -s -f "https://$URL_APP/health" || true
